name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Blocking as of the frontend rebuild: the tree went from 397 errors to
      # zero, so anything that reappears is new and belongs to whoever added it.
      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # No DATABASE_URL is set here, and settings.py forces sqlite whenever
      # TESTING is true, so none of these steps can reach a real database.
      - name: System check
        run: python manage.py check

      - name: Detect missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test --verbosity 2

      # The frontend's types are derived from the backend schemas. If they drift,
      # a renamed field stops being a build error and becomes a runtime bug.
      - name: Generated types are current
        run: python manage.py generate_types --check
